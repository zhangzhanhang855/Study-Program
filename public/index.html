<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JR AI 智能研学中枢</title>
  
  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- KaTeX 数学公式渲染库 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: rgba(22, 28, 41, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 40%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 40%);
      color: var(--text-main);
      font-family: 'Google Sans', 'Noto Serif SC', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      backdrop-filter: blur(20px);
      background: rgba(11, 15, 23, 0.8);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-hub {
      background: linear-gradient(135deg, var(--accent), var(--accent-purple));
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-weight: 600;
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover { box-shadow: 0 4px 16px var(--accent-glow); transform: translateY(-1px); }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.2); }

    /* 课程卡片 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 16px;
    }
    .course-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      cursor: pointer;
      transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .course-item:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.25);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    /* 正文排版与丰富组件扩展 */
    .content-body {
      line-height: 1.8;
      font-size: 1.05rem;
      color: #e2e8f0;
      margin-top: 20px;
    }
    .content-body p { margin-bottom: 16px; }
    .content-body code {
      font-family: var(--font-mono);
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 4px;
      color: #93c5fd;
      font-size: 0.9em;
    }

    /* 表格组件样式增强 */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin: 24px 0;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.25);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }
    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    th {
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    /* 几何与坐标系动态交互沙盒 */
    .geo-sandbox {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      margin: 28px 0;
    }
    .geo-sandbox-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .geo-canvas-wrap {
      position: relative;
      width: 100%;
      height: 380px;
      background: #070a0f;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }
    canvas { display: block; width: 100%; height: 100%; }

    .matrix-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
      background: rgba(0,0,0,0.3);
      padding: 16px;
      border-radius: 10px;
    }
    .matrix-slider {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
    }
    .matrix-slider input[type=range] {
      flex: 1;
      accent-color: var(--accent);
    }

    .preset-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .chip {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .chip:hover { background: rgba(59, 130, 246, 0.2); border-color: var(--accent); }

    /* 测验模块 */
    .quiz-card {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      margin-top: 28px;
    }
    .quiz-opt {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .quiz-opt:hover { background: rgba(255,255,255,0.06); }
    .quiz-opt.selected {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.18);
    }

    /* 登录弹窗 */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .input {
      width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--card-border);
      border-radius: 8px; padding: 12px; color: #fff; margin-bottom: 14px; outline: none;
    }
    .input:focus { border-color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>JR AI 研学中枢</span>
      <span class="badge-hub">PRO-VISION</span>
    </div>
    <div>
      <span id="userNameDisplay" style="color:var(--text-sub); font-size:0.9rem;">校验中...</span>
      <button class="btn-ghost" id="logoutBtn" style="display:none; margin-left:12px;" onclick="logout()">登出</button>
    </div>
  </header>

  <!-- 登录/注册浮层 -->
  <div class="overlay" id="authModal" style="display:none;">
    <div class="glass" style="max-width:380px; width:100%;">
      <h3 id="authTitle" style="margin-bottom:8px;">访问会话验证</h3>
      <p style="color:var(--text-sub); font-size:0.85rem; margin-bottom:20px;">基于安全 Session 机制建立端云同步</p>
      <input type="text" id="username" class="input" placeholder="输入学员识别标识" />
      <input type="password" id="password" class="input" placeholder="访问安全密钥" />
      <button class="btn" style="width:100%;" onclick="submitAuth()">接入终端</button>
      <div style="margin-top:14px; text-align:center;">
        <a href="javascript:void(0)" onclick="toggleReg()" style="color:var(--accent); font-size:0.85rem; text-decoration:none;" id="regToggleText">新学员？注册账号</a>
      </div>
    </div>
  </div>

  <!-- 大纲门户视图 -->
  <main id="portal">
    <div class="glass" style="margin-bottom:24px;">
      <h3 style="margin-bottom:12px;">📌 每日概况</h3>
      <div id="resumeBox" style="color:var(--text-sub);">正在同步云端档案...</div>
    </div>

    <h3 style="margin-top:32px;">学科图谱</h3>
    <div id="courseList" class="card-grid"></div>
  </main>

  <!-- 学习与交互工作台 -->
  <main id="study" style="display:none;">
    <button class="btn-ghost" onclick="exitStudy()" style="margin-bottom:16px;">← 返回目录</button>
    <div class="glass">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span id="studyBelong" style="font-size:0.8rem; color:#60a5fa; background:rgba(59,130,246,0.15); padding:3px 10px; border-radius:6px;"></span>
        <span id="chapterIndex" style="color:var(--text-sub); font-size:0.9rem; font-family:var(--font-mono);"></span>
      </div>
      <h2 id="studyTitle" style="margin-top:10px;"></h2>

      <!-- 动态交互几何沙盒容器（若章节配置则激活） -->
      <div id="interactiveSandboxArea"></div>

      <!-- 正文内容（支持表格、KaTeX 公式） -->
      <div id="studyContent" class="content-body"></div>

      <!-- 随堂单测 -->
      <div id="quizArea"></div>

      <div style="margin-top:32px; display:flex; justify-content:space-between;">
        <button class="btn-ghost" id="prevBtn" onclick="moveChapter(-1)">上一节</button>
        <button class="btn" id="nextBtn" onclick="moveChapter(1)">完成本节并同步</button>
      </div>
    </div>
  </main>

  <script>
    let isReg = false, activeCourse = null, courseData = null, chIdx = 0, curAns = null;
    let canvasAnimId = null;

    window.onload = checkAuth;

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const d = await res.json();
          document.getElementById('userNameDisplay').innerText = '学员: ' + d.username;
          document.getElementById('logoutBtn').style.display = 'inline-block';
          document.getElementById('authModal').style.display = 'none';
          initDashboard();
        } else {
          document.getElementById('authModal').style.display = 'flex';
        }
      } catch(e) { document.getElementById('authModal').style.display = 'flex'; }
    }

    function toggleReg() {
      isReg = !isReg;
      document.getElementById('authTitle').innerText = isReg ? '注册新学员节点' : '访问会话验证';
      document.getElementById('regToggleText').innerText = isReg ? '已有账号？去登录' : '新学员？注册账号';
    }

    async function submitAuth() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const ep = isReg ? '/api/auth/register' : '/api/auth/login';
      const r = await fetch(ep, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username: u, password: p }) });
      if (r.ok) location.reload();
      else alert((await r.json()).error);
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.reload();
    }

    async function initDashboard() {
      const [sumRes, curRes] = await Promise.all([fetch('/api/progress/summary'), fetch('/api/courses')]);
      const { lastProgress } = await sumRes.json();
      const { courses } = await curRes.json();

      document.getElementById('resumeBox').innerHTML = lastProgress
        ? '上次学到 <strong>' + lastProgress.courseName + '</strong>（第 ' + (lastProgress.lastChapterIndex + 1) + ' 节）'
        : '暂无进行中的科目，请在下方点击开启。';

      const wrap = document.getElementById('courseList');
      wrap.innerHTML = '';
      courses.forEach(c => {
        const d = document.createElement('div');
        d.className = 'course-item';
        d.innerHTML = '<span style="font-size:0.75rem; color:#60a5fa;">' + c.belongTo + '</span><h4 style="margin-top:6px;">' + c.name + '</h4>';
        d.onclick = () => startCourse(c);
        wrap.appendChild(d);
      });
    }

    async function startCourse(c) {
      activeCourse = c;
      const r = await fetch('/api/course-content?url=' + encodeURIComponent(c.url));
      courseData = await r.json();
      chIdx = 0;
      document.getElementById('portal').style.display = 'none';
      document.getElementById('study').style.display = 'block';
      document.getElementById('studyTitle').innerText = c.name;
      document.getElementById('studyBelong').innerText = c.belongTo;
      renderCh();
    }

    function renderCh() {
      const ch = courseData.chapters[chIdx];
      document.getElementById('chapterIndex').innerText = 'CHAPTER ' + (chIdx + 1) + ' / ' + courseData.chapters.length;
      document.getElementById('studyTitle').innerText = ch.title;
      
      // 1. 渲染正文 HTML
      const contentEl = document.getElementById('studyContent');
      contentEl.innerHTML = ch.content;

      // 2. 触发 KaTeX 数学公式自动解析
      if (window.renderMathInElement) {
        renderMathInElement(contentEl, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }

      // 3. 构建动态交互沙盒（如果章节配置了 interactive 属性，或智能匹配线性代数类主题）
      setupInteractiveSandbox(ch);

      // 4. 渲染随堂测验
      curAns = null;
      const qBox = document.getElementById('quizArea');
      qBox.innerHTML = '';
      if (ch.quiz) {
        const wrap = document.createElement('div');
        wrap.className = 'quiz-card';
        wrap.innerHTML = '<strong>💡 随堂概念测验：' + ch.quiz.question + '</strong>';
        ch.quiz.options.forEach((opt, i) => {
          const o = document.createElement('div');
          o.className = 'quiz-opt';
          o.innerText = opt;
          o.onclick = () => {
            wrap.querySelectorAll('.quiz-opt').forEach(el => el.classList.remove('selected'));
            o.classList.add('selected');
            curAns = i;
          };
          wrap.appendChild(o);
        });
        qBox.appendChild(wrap);
      }
      document.getElementById('prevBtn').disabled = (chIdx === 0);
    }

    // ==========================================
    // 动态几何 & 矩阵空间变换引擎 (Canvas 2D)
    // ==========================================
    function setupInteractiveSandbox(ch) {
      const area = document.getElementById('interactiveSandboxArea');
      if (canvasAnimId) cancelAnimationFrame(canvasAnimId);
      area.innerHTML = '';

      // 只要配置了 interactive 或者标题包含向量/变换/矩阵，均动态挂载沙盒
      const needsGeo = ch.interactive || /向量|变换|矩阵|空间|基/i.test(ch.title);
      if (!needsGeo) return;

      area.innerHTML = `
        <div class="geo-sandbox">
          <div class="geo-sandbox-header">
            <div>
              <strong style="font-size:0.95rem;">📐 空间交互变换视窗</strong>
              <span style="font-size:0.8rem; color:var(--text-sub); margin-left:10px;">拖动滑块操纵基向量落点，观察空间变形与行列式面积</span>
            </div>
            <div id="detIndicator" style="font-family:var(--font-mono); font-size:0.85rem; color:#38bdf8;">det(A) = 1.00</div>
          </div>
          <div class="geo-canvas-wrap">
            <canvas id="geoCanvas"></canvas>
          </div>
          <div class="matrix-panel">
            <div class="matrix-slider">
              <span style="color:#f43f5e;">î_x (a):</span>
              <input type="range" id="sl_a" min="-3" max="3" step="0.1" value="1">
              <span id="val_a">1.0</span>
            </div>
            <div class="matrix-slider">
              <span style="color:#f43f5e;">î_y (b):</span>
              <input type="range" id="sl_b" min="-3" max="3" step="0.1" value="0">
              <span id="val_b">0.0</span>
            </div>
            <div class="matrix-slider">
              <span style="color:#10b981;">ĵ_x (c):</span>
              <input type="range" id="sl_c" min="-3" max="3" step="0.1" value="0">
              <span id="val_c">0.0</span>
            </div>
            <div class="matrix-slider">
              <span style="color:#10b981;">ĵ_y (d):</span>
              <input type="range" id="sl_d" min="-3" max="3" step="0.1" value="1">
              <span id="val_d">1.0</span>
            </div>
          </div>
          <div class="preset-chips">
            <span class="chip" onclick="applyPreset(1,0,0,1)">恒等变换 (Identity)</span>
            <span class="chip" onclick="applyPreset(1,0,1,1)">水平剪切 (Shear X)</span>
            <span class="chip" onclick="applyPreset(0.7,-0.7,0.7,0.7)">逆时针旋转 45°</span>
            <span class="chip" onclick="applyPreset(1,1,1,1)">降维打击 (det = 0)</span>
            <span class="chip" onclick="applyPreset(2,0,0,2)">均匀放大 2×</span>
          </div>
        </div>
      `;

      initCanvasSandbox();
    }

    let mState = { a: 1, b: 0, c: 0, d: 1 };

    function applyPreset(a, b, c, d) {
      mState = { a, b, c, d };
      document.getElementById('sl_a').value = a; document.getElementById('val_a').innerText = a.toFixed(1);
      document.getElementById('sl_b').value = b; document.getElementById('val_b').innerText = b.toFixed(1);
      document.getElementById('sl_c').value = c; document.getElementById('val_c').innerText = c.toFixed(1);
      document.getElementById('sl_d').value = d; document.getElementById('val_d').innerText = d.toFixed(1);
    }

    function initCanvasSandbox() {
      const canvas = document.getElementById('geoCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
        canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }
      resize();

      ['a','b','c','d'].forEach(key => {
        const slider = document.getElementById('sl_' + key);
        slider.oninput = (e) => {
          mState[key] = parseFloat(e.target.value);
          document.getElementById('val_' + key).innerText = mState[key].toFixed(1);
        };
      });

      function draw() {
        const w = canvas.parentElement.clientWidth;
        const h = canvas.parentElement.clientHeight;
        const cx = w / 2;
        const cy = h / 2;
        const scale = 40; // 1 个单位 = 40 像素

        ctx.clearRect(0, 0, w, h);

        const { a, b, c, d } = mState;
        const det = a * d - b * c;
        const detEl = document.getElementById('detIndicator');
        if (detEl) detEl.innerText = `det(A) = ${det.toFixed(2)}`;

        // 1. 绘制原始底色网格
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let x = -10; x <= 10; x++) {
          ctx.beginPath();
          ctx.moveTo(cx + x * scale, 0);
          ctx.lineTo(cx + x * scale, h);
          ctx.stroke();
        }
        for (let y = -10; y <= 10; y++) {
          ctx.beginPath();
          ctx.moveTo(0, cy + y * scale);
          ctx.lineTo(w, cy + y * scale);
          ctx.stroke();
        }

        // 2. 绘制变换后的网格（受矩阵 a,b,c,d 变形）
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.2)';
        ctx.lineWidth = 1;
        for (let i = -8; i <= 8; i++) {
          // 常数 x 直线变换
          ctx.beginPath();
          const startX = i * a - 8 * c;
          const startY = i * b - 8 * d;
          const endX = i * a + 8 * c;
          const endY = i * b + 8 * d;
          ctx.moveTo(cx + startX * scale, cy - startY * scale);
          ctx.lineTo(cx + endX * scale, cy - endY * scale);
          ctx.stroke();

          // 常数 y 直线变换
          ctx.beginPath();
          const sX = -8 * a + i * c;
          const sY = -8 * b + i * d;
          const eX = 8 * a + i * c;
          const eY = 8 * b + i * d;
          ctx.moveTo(cx + sX * scale, cy - sY * scale);
          ctx.lineTo(cx + eX * scale, cy - eY * scale);
          ctx.stroke();
        }

        // 3. 绘制行列式面积（平行四边形）
        ctx.fillStyle = det >= 0 ? 'rgba(56, 189, 248, 0.25)' : 'rgba(244, 63, 94, 0.25)';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + a * scale, cy - b * scale);
        ctx.lineTo(cx + (a + c) * scale, cy - (b + d) * scale);
        ctx.lineTo(cx + c * scale, cy - d * scale);
        ctx.closePath();
        ctx.fill();

        // 4. 绘制世界坐标原点坐标轴
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
        ctx.moveTo(0, cy); ctx.lineTo(w, cy);
        ctx.stroke();

        // 5. 绘制变换后的基向量 î (红色) 和 ĵ (绿色)
        drawVector(ctx, cx, cy, a * scale, -b * scale, '#f43f5e', 'î');
        drawVector(ctx, cx, cy, c * scale, -d * scale, '#10b981', 'ĵ');

        canvasAnimId = requestAnimationFrame(draw);
      }

      function drawVector(ctx, fromX, fromY, vecX, vecY, color, label) {
        const toX = fromX + vecX;
        const toY = fromY + vecY;
        const headlen = 10;
        const angle = Math.atan2(vecY, vecX);

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 3;

        // 箭杆
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.stroke();

        // 箭头
        ctx.beginPath();
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();

        // 标签文字
        ctx.font = 'bold 13px JetBrains Mono';
        ctx.fillText(label, toX + 8, toY + 4);
      }

      draw();
    }

    async function moveChapter(dir) {
      const ch = courseData.chapters[chIdx];
      let score = null;
      if (ch.quiz && curAns !== null) {
        score = { score: curAns === ch.quiz.answerIndex ? 100 : 0, total: 100 };
      }
      await fetch('/api/progress/update', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          courseName: activeCourse.name,
          belongTo: activeCourse.belongTo,
          courseUrl: activeCourse.url,
          chapterIndex: chIdx,
          quizResult: score
        })
      });

      const next = chIdx + dir;
      if (next >= 0 && next < courseData.chapters.length) {
        chIdx = next;
        renderCh();
      } else if (next >= courseData.chapters.length) {
        alert('🎉 恭喜完成本科目全部章节！');
        exitStudy();
      }
    }

    function exitStudy() {
      if (canvasAnimId) cancelAnimationFrame(canvasAnimId);
      document.getElementById('study').style.display = 'none';
      document.getElementById('portal').style.display = 'block';
      initDashboard();
    }
  </script>
