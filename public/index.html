<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JR AI 智能研学中枢</title>
  <!-- 引入 Google Sans & Noto Serif SC 衬线字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0c0f14;
      --card-bg: rgba(26, 32, 44, 0.65);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --font-code: "SF Mono", "Fira Code", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Google Sans', 'Noto Serif SC', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶栏 */
    header {
      backdrop-filter: blur(20px);
      background: rgba(12, 15, 20, 0.7);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-tag {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      font-family: var(--font-code);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.9rem;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* 主容器 */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* 模态框与登录窗 */
    .auth-overlay {
      position: fixed;
      inset: 0;
      backdrop-filter: blur(25px);
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .glass-box {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .auth-card h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .auth-card p {
      color: var(--text-sub);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .input-glass {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .input-glass:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* 每日看板 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      margin-bottom: 40px;
    }

    @media (max-width: 860px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    .overview-card {
      position: relative;
      overflow: hidden;
    }

    .overview-card h3 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .resume-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag-module {
      font-size: 0.75rem;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.15);
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 6px;
    }

    /* 课程分类库 */
    .section-title {
      font-size: 1.3rem;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .module-group {
      margin-bottom: 32px;
    }

    .module-header {
      font-size: 1rem;
      color: var(--text-sub);
      margin-bottom: 14px;
      border-left: 3px solid var(--accent);
      padding-left: 10px;
    }

    .course-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .course-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .course-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
    }

    /* 学习交互工作区 */
    #studyView {
      display: none;
    }

    .lesson-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 32px;
      margin-top: 16px;
    }

    .quiz-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      margin-top: 24px;
    }

    .quiz-option {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quiz-option:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .quiz-option.selected {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.15);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin: 16px 0;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- 顶栏 -->
  <header>
    <div class="brand">
      <span>JR AI 学研终端</span>
      <span class="brand-tag">v2.0</span>
    </div>
    <div class="user-profile" id="userBar">
      <span id="userNameDisplay">检测状态中...</span>
      <button class="btn-ghost" id="logoutBtn" style="display:none;" onclick="logout()">登出</button>
    </div>
  </header>

  <!-- 登录 / 注册 浮层（如果未登录强制弹出） -->
  <div class="auth-overlay" id="authModal" style="display:none;">
    <div class="glass-box auth-card">
      <h2 id="authTitle">访问凭证验证</h2>
      <p id="authSubtitle">输入账号并颁发端侧安全 Session Cookie</p>
      
      <div class="form-group">
        <label>学员代号</label>
        <input type="text" id="username" class="input-glass" placeholder="例如：zhangzh" />
      </div>
      <div class="form-group">
        <label>访问密钥</label>
        <input type="password" id="password" class="input-glass" placeholder="••••••••" />
      </div>

      <button class="btn-primary" id="authSubmitBtn" onclick="handleAuthSubmit()">建立安全会话</button>
      <div style="margin-top: 16px; font-size: 0.85rem;">
        <a href="javascript:void(0)" id="toggleAuthMode" style="color:var(--accent); text-decoration:none;" onclick="toggleAuthMode()">新学员？注册并接入</a>
      </div>
    </div>
  </div>

  <!-- 核心视窗 -->
  <main>
    <!-- 1. 仪表盘与大纲 (Portal View) -->
    <div id="portalView">
      <div class="dashboard-grid">
        <!-- 每日概况 & 继续上次 -->
        <div class="glass-box overview-card">
          <h3>📌 每日概况</h3>
          <div id="continueStudyCard">
            <p style="color:var(--text-sub);">暂无未完成的项目，请在下方探索新课程。</p>
          </div>
        </div>

        <!-- 本周成果 -->
        <div class="glass-box overview-card">
          <h3>📈 本周成果</h3>
          <div id="weeklyStatsBox">
            <p style="color:var(--text-sub);">正在同步本周节点活动...</p>
          </div>
        </div>
      </div>

      <!-- 动态学习库 -->
      <h2 class="section-title">课程图谱</h2>
      <div id="courseContainer">正在从 studyindex.pages.dev 拉取索引...</div>
    </div>

    <!-- 2. 交互学习视窗 (Study View) -->
    <div id="studyView">
      <button class="btn-ghost" onclick="exitStudyView()" style="margin-bottom:16px;">← 返回知识库概览</button>
      <div class="lesson-container">
        <span class="tag-module" id="studyBelongTo">归属模块</span>
        <h1 id="studyCourseTitle" style="margin: 8px 0;">课程名称</h1>
        <div class="progress-bar-wrap">
          <div class="progress-fill" id="courseProgressFill"></div>
        </div>

        <div style="display:flex; justify-content:space-between; margin-bottom: 24px; color:var(--text-sub); font-size:0.9rem;">
          <span id="chapterTitle">章节加载中...</span>
          <span id="chapterIndexBadge">第 1 章</span>
        </div>

        <!-- 交互内容呈现 -->
        <div id="studyContentArea" style="line-height: 1.7; font-size: 1.05rem; margin-bottom: 24px;"></div>

        <!-- 动态答题卡片 -->
        <div id="quizContainer"></div>

        <div style="display:flex; justify-content: space-between; margin-top: 32px;">
          <button class="btn-ghost" id="prevChapterBtn" onclick="navChapter(-1)">上一节</button>
          <button class="btn-primary" style="width: auto; padding: 10px 24px;" id="nextChapterBtn" onclick="navChapter(1)">下一节并同步</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let isRegisterMode = false;
    let currentUser = null;
    let activeCourse = null;
    let activeLessonData = null;
    let currentChapterIdx = 0;
    let selectedAnswer = null;

    // --- 初始化检查 ---
    window.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
    });

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const data = await res.json();
          currentUser = data.username;
          document.getElementById('userNameDisplay').innerText = `学员: ${currentUser}`;
          document.getElementById('logoutBtn').style.display = 'inline-block';
          document.getElementById('authModal').style.display = 'none';
          loadDashboardAndCourses();
        } else {
          showAuthModal();
        }
      } catch (e) {
        showAuthModal();
      }
    }

    function showAuthModal() {
      document.getElementById('userNameDisplay').innerText = '未接入';
      document.getElementById('logoutBtn').style.display = 'none';
      document.getElementById('authModal').style.display = 'flex';
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authTitle').innerText = isRegisterMode ? '注册并接入' : '访问凭证验证';
      document.getElementById('authSubtitle').innerText = isRegisterMode ? '创建新的学习节点并在安全环境中存储凭证' : '输入账号并颁发端侧安全 Session Cookie';
      document.getElementById('authSubmitBtn').innerText = isRegisterMode ? '立即注册' : '建立安全会话';
      document.getElementById('toggleAuthMode').innerText = isRegisterMode ? '已有账号？登入会话' : '新学员？注册并接入';
    }

    async function handleAuthSubmit() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (!u || !p) return alert('请填写用户名与密码');

      const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });

      const data = await res.json();
      if (res.ok) {
        location.reload();
      } else {
        alert(data.error || '验证失败');
      }
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.reload();
    }

    // --- 加载大纲与概况 ---
    async function loadDashboardAndCourses() {
      // 1. 获取每日概况与统计
      const sumRes = await fetch('/api/progress/summary');
      const sumData = await sumRes.json();

      // 渲染继续上次学习
      const contBox = document.getElementById('continueStudyCard');
      if (sumData.lastProgress) {
        const lp = sumData.lastProgress;
        contBox.innerHTML = `
          <div class="resume-box">
            <div>
              <span class="tag-module">${lp.belongTo}</span>
              <h4 style="margin:4px 0 6px 0; font-size:1.1rem;">${lp.courseName}</h4>
              <p style="font-size:0.85rem; color:var(--text-sub);">
                上次定位在第 ${lp.lastChapterIndex + 1} 节 · 更新于 ${new Date(lp.updatedAt).toLocaleDateString()}
              </p>
            </div>
            <button class="btn-primary" style="width:auto; padding:8px 16px;" onclick="resumeCourse('${encodeURIComponent(JSON.stringify(lp))}')">继续学习</button>
          </div>
        `;
      }

      // 渲染本周成果
      const weeklyBox = document.getElementById('weeklyStatsBox');
      if (sumData.weeklyRecords && sumData.weeklyRecords.length > 0) {
        weeklyBox.innerHTML = `
          <p style="margin-bottom:8px; font-size:0.95rem;">本周活跃研读科目：<strong>${sumData.weeklyRecords.length} 门</strong></p>
          <ul style="padding-left:18px; color:var(--text-sub); font-size:0.85rem; line-height:1.6;">
            ${sumData.weeklyRecords.slice(0, 3).map(r => `<li>${r.courseName} (已解锁 ${r.completedChapters.length} 节)</li>`).join('')}
          </ul>
        `;
      } else {
        weeklyBox.innerHTML = `<p style="color:var(--text-sub); font-size:0.9rem;">本周尚无研学归档，开启你的第一个里程碑吧！</p>`;
      }

      // 2. 获取并渲染课程列表
      const courseRes = await fetch('/api/courses');
      const { courses } = await courseRes.json();

      const container = document.getElementById('courseContainer');
      container.innerHTML = '';

      // 按模块 BELONG_TO 分组
      const modules = {};
      courses.forEach(c => {
        if (!modules[c.belongTo]) modules[c.belongTo] = [];
        modules[c.belongTo].push(c);
      });

      for (const [moduleName, list] of Object.entries(modules)) {
        const modEl = document.createElement('div');
        modEl.className = 'module-group';
        modEl.innerHTML = `<h3 class="module-header">${moduleName}</h3>`;

        const cardsWrap = document.createElement('div');
        cardsWrap.className = 'course-cards';

        list.forEach(c => {
          const userProg = sumData.allProgressMap[c.name];
          const completedCount = userProg ? userProg.completedChapters.length : 0;

          const card = document.createElement('div');
          card.className = 'course-card';
          card.innerHTML = `
            <span class="tag-module">${c.belongTo}</span>
            <h4 style="margin: 10px 0 6px 0;">${c.name}</h4>
            <div style="font-size:0.8rem; color:var(--text-sub); margin-top:12px;">
              ${userProg ? `已修章节：${completedCount} 节` : '尚未启程'}
            </div>
          `;
          card.onclick = () => openCourse(c, userProg ? userProg.lastChapterIndex : 0);
          cardsWrap.appendChild(card);
        });

        modEl.appendChild(cardsWrap);
        container.appendChild(modEl);
      }
    }

    // --- 进入课程研读 ---
    async function openCourse(course, startChapterIdx = 0) {
      activeCourse = course;
      currentChapterIdx = startChapterIdx;

      // 切换视图
      document.getElementById('portalView').style.display = 'none';
      document.getElementById('studyView').style.display = 'block';

      document.getElementById('studyCourseTitle').innerText = course.name;
      document.getElementById('studyBelongTo').innerText = course.belongTo;

      // 从后端读取课程 JSON 结构
      const res = await fetch(`/api/course-content?url=${encodeURIComponent(course.url)}`);
      activeLessonData = await res.json();

      renderChapter();
    }

    function resumeCourse(encodedCourseData) {
      const data = JSON.parse(decodeURIComponent(encodedCourseData));
      openCourse({
        name: data.courseName,
        belongTo: data.belongTo,
        url: data.courseUrl
      }, data.lastChapterIndex || 0);
    }

    function exitStudyView() {
      document.getElementById('studyView').style.display = 'none';
      document.getElementById('portalView').style.display = 'block';
      loadDashboardAndCourses();
    }

    // --- 章节与答题引擎渲染 ---
    function renderChapter() {
      if (!activeLessonData || !activeLessonData.chapters) return;
      const ch = activeLessonData.chapters[currentChapterIdx];

      document.getElementById('chapterIndexBadge').innerText = `第 ${currentChapterIdx + 1} / ${activeLessonData.chapters.length} 节`;
      document.getElementById('chapterTitle').innerText = ch.title;
      document.getElementById('studyContentArea').innerHTML = ch.content || '<p>本节无静态正文。</p>';

      // 计算进度条
      const progressPercent = ((currentChapterIdx + 1) / activeLessonData.chapters.length) * 100;
      document.getElementById('courseProgressFill').style.width = `${progressPercent}%`;

      // 渲染测验
      const quizBox = document.getElementById('quizContainer');
      quizBox.innerHTML = '';
      selectedAnswer = null;

      if (ch.quiz) {
        const qCard = document.createElement('div');
        qCard.className = 'quiz-card';
        qCard.innerHTML = `<h4 style="margin-bottom:8px;">💡 课内随堂测验：${ch.quiz.question}</h4>`;

        ch.quiz.options.forEach((opt, idx) => {
          const optBtn = document.createElement('div');
          optBtn.className = 'quiz-option';
          optBtn.innerText = opt;
          optBtn.onclick = () => {
            qCard.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
            optBtn.classList.add('selected');
            selectedAnswer = idx;
          };
          qCard.appendChild(optBtn);
        });

        quizBox.appendChild(qCard);
      }

      // 控制导航按钮状态
      document.getElementById('prevChapterBtn').disabled = currentChapterIdx === 0;
      document.getElementById('nextChapterBtn').innerText = (currentChapterIdx === activeLessonData.chapters.length - 1) ? '完成研学并同步' : '下一节并同步';
    }

    async function navChapter(direction) {
      const ch = activeLessonData.chapters[currentChapterIdx];
      let quizScore = null;

      // 评估测验答题结果
      if (ch.quiz) {
        if (selectedAnswer === null) {
          if (!confirm('你尚未完成随堂测验，确定直接跳过进入下一节吗？')) return;
        } else {
          quizScore = {
            score: (selectedAnswer === ch.quiz.answerIndex) ? 100 : 0,
            total: 100
          };
        }
      }

      // 同步当前章节与答题成绩至 MongoDB
      await fetch('/api/progress/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          courseName: activeCourse.name,
          belongTo: activeCourse.belongTo,
          courseUrl: activeCourse.url,
          chapterIndex: currentChapterIdx,
          quizResult: quizScore
        })
      });

      const nextIdx = currentChapterIdx + direction;
      if (nextIdx >= 0 && nextIdx < activeLessonData.chapters.length) {
        currentChapterIdx = nextIdx;
        renderChapter();
      } else if (nextIdx >= activeLessonData.chapters.length) {
        alert('🎉 恭喜！你已完成本科目的所有章节学习，成就数据已更新到云端！');
        exitStudyView();
      }
    }
  </script>
</body>
</html>
