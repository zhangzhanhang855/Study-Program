<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JR Study Hub | 智能学习空间</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0d12;
      --card-bg: rgba(26, 28, 38, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #5e81ff;
      --accent-hover: #7b98ff;
      --text-main: #f3f4f8;
      --text-sub: #949ab1;
      --success: #3dd68c;
      --danger: #ff5f7e;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(94, 129, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(61, 214, 140, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: rgba(12, 13, 18, 0.7);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand span {
      background: linear-gradient(135deg, var(--accent), #b478ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex: 1;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      margin-bottom: 1.5rem;
    }

    /* 每日概况 */
    .overview-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 1.2rem;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(94, 129, 255, 0.2);
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
    }
    .stat-item {
      text-align: center;
    }
    .stat-num {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    /* 课程分类 */
    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 2rem 0 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.2rem;
    }

    .course-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .course-card:hover {
      transform: translateY(-4px);
      border-color: rgba(94, 129, 255, 0.4);
    }

    /* 按钮与交互元素 */
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1.2rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: var(--accent-hover);
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* 学习交互弹窗 / 全屏 */
    #studyModal {
      position: fixed;
      inset: 0;
      background: rgba(12, 13, 18, 0.85);
      backdrop-filter: blur(25px);
      display: none;
      z-index: 1000;
      overflow-y: auto;
      padding: 2rem;
    }
    .modal-content {
      max-width: 800px;
      margin: 0 auto;
    }

    /* 测验选项 */
    .quiz-option {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .quiz-option:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .quiz-option.selected {
      border-color: var(--accent);
      background: rgba(94, 129, 255, 0.15);
    }

    /* 登录弹层 */
    #authModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      display: none;
      place-items: center;
      z-index: 2000;
    }
    .auth-box {
      width: 360px;
    }
    .input-group {
      margin-bottom: 1rem;
    }
    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 0.4rem;
    }
    .input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.8rem;
      color: #fff;
      outline: none;
    }
    .input-group input:focus {
      border-color: var(--accent);
    }

      .overview-grid { grid-template-columns: 1fr; }
      header { padding: 1
